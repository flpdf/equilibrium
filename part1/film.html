// ---------- word times ----------
const nrm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9:]/g, '').replace(/:$/, '');
const LN = i => TIMING.lines[i];
function w(li, word, n = 0) {
  const ws = LN(li).words.filter(x => nrm(x.w) === nrm(word));
  if (!ws.length) throw new Error(`"${word}" não está na fala ${li}: ${LN(li).text}`);
  return ws[Math.min(n, ws.length - 1)].s;
}
const S = i => LN(i).start, E = i => LN(i).end, VEND = TIMING.voice_end;
const tApaga = w(0, 'apaga');

// ---------- 2D helpers ----------
function T(c, s, x, y, px, color, o = {}) {
  c.font = `${o.w || 700} ${px}px ${o.mono ? '"JetBrains Mono"' : 'Oswald'}`; c.textAlign = o.align || 'center'; c.textBaseline = 'middle';
  if (o.maxW) { const m = c.measureText(s).width; if (m > o.maxW) c.font = `${o.w || 700} ${Math.floor(px * o.maxW / m)}px ${o.mono ? '"JetBrains Mono"' : 'Oswald'}`; }
  if (o.stroke) { c.lineJoin = 'round'; c.lineWidth = o.stroke; c.strokeStyle = '#0b0c0f'; c.strokeText(s, x, y); }
  c.fillStyle = color; c.fillText(s, x, y);
}
function canvasTex(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
// a flat 2D prop on a camera-facing plane (same model in every shot)
function flatProp(wm, hm, px, draw, o = {}) {
  const tex = canvasTex(px, Math.round(px * hm / wm), draw);
  const g = new THREE.PlaneGeometry(wm, hm); g.translate(0, hm / 2, 0);
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: tex, alphaTest: 0.5, side: THREE.DoubleSide, emissive: '#ffffff', emissiveMap: tex, emissiveIntensity: o.glow ?? 0.25, roughness: 1 }));
  m.castShadow = true; m.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: tex, alphaTest: 0.5 });
  if (o.billboard !== false) m.userData.billboard = cam => { const p = new THREE.Vector3(); cam.getWorldPosition(p); const q = new THREE.Vector3(); m.getWorldPosition(q); m.rotation.y = Math.atan2(p.x - q.x, p.z - q.z); };
  return m;
}
function sign(wm, hm, px, draw, glow = 1) {
  const tex = canvasTex(px, Math.round(px * hm / wm), draw);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(wm, hm), new THREE.MeshStandardMaterial({ map: tex, emissive: '#ffffff', emissiveMap: tex, emissiveIntensity: glow, roughness: 0.6 }));
  return m;
}
const knockShake = (t, t0, n = 3, gap = 0.33) => { let s = 0; for (let k = 0; k < n; k++) { const d = t - (t0 + k * gap); if (d >= 0) s += Math.exp(-d * 18) * Math.sin(d * 90); } return s; };
