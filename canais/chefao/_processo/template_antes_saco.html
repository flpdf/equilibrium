<script type="module">
import * as THREE from 'three';

const EP=await (await fetch('episode.json?'+Date.now())).json();
window.EP=EP;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eob=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};

const lerp=(a,b,x)=>a+(b-a)*x;

// ---------- fill HUD text from episode ----------
$('water').textContent=(EP.watermark+'  ').repeat(3);
$('tbl').textContent=EP.topbar.left; $('tbr').textContent=EP.topbar.right;
$('cname').innerHTML=EP.card.name.map(esc).join('<br>');
$('crows').innerHTML=EP.card.rows.map(r=>`<div><span>${esc(r[0])}</span><b ${r[2]==='r'?'style="color:var(--red)"':''}>${esc(r[1])}</b></div>`).join('');
EP.errors.forEach((e,i)=>{$('c'+(i+1)).querySelector('span').textContent=e.check;});
$('onext').textContent=EP.outro.next+' · EM BREVE';
const fig='<svg viewBox="0 0 120 150"><circle cx="60" cy="22" r="16" fill="none" stroke="#5a5e68" stroke-width="5"/><path d="M60 40V95M30 60L60 50L90 60M60 95L38 140M60 95L82 140" stroke="#5a5e68" stroke-width="7" fill="none" stroke-linecap="round"/></svg>';
$('ctagrid').innerHTML=EP.cta.cards.map((c,i)=>`<div class="cd" id="k${i}"><div class="tag mono">VOTE</div><div class="ix mono">0${i+1}</div>${fig}<div class="nm">${c[0].split('\n').map(esc).join('<br>')}</div><div class="lv mono">${esc(c[1])}</div></div>`).join('')+
 `<div class="cd mys" id="k3"><div class="tag mono">VOTE</div><div class="ix mono">04</div><div class="nm" style="bottom:120px;font-size:160px">???</div><div class="lv mono">VOCÊ ESCOLHE</div></div>`;

// ---------- 3D ----------
const W=1080,H=1920;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,alpha:true});
renderer.setPixelRatio(1);renderer.setSize(W,H);renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
$('stage').appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.fog=new THREE.Fog(0x0b0c0f,500,1300);
const cam=new THREE.PerspectiveCamera(30,W/H,10,4000);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),new THREE.ShadowMaterial({opacity:.45}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(3000,60,0x2a2d35,0x1a1c22);grid.position.y=.2;scene.add(grid);
const discMat=new THREE.MeshBasicMaterial({color:0x3dff8a,transparent:true,opacity:0,depthWrite:false});
const disc=new THREE.Mesh(new THREE.CircleGeometry(60,64),discMat);disc.rotation.x=-Math.PI/2;disc.position.y=.5;scene.add(disc);
scene.add(new THREE.HemisphereLight(0xdfe6ff,0x101015,1.1));
const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(180,420,320);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-250,right:250,top:260,bottom:-60,near:10,far:1400});scene.add(key);
const rim=new THREE.DirectionalLight(0xff3b47,1.6);rim.position.set(-300,220,-300);scene.add(rim);
const rim2=new THREE.DirectionalLight(0x9fb4ff,.7);rim2.position.set(300,150,-250);scene.add(rim2);
// ================= PISCINA (EP.ambiente==="piscina") =================
// Água em y=0 (WL). Nadador fica parado no quadro; a piscina (fundo, raias, boias, bolhas) corre para trás = deslocamento.
const POOL=EP.ambiente==='piscina'; const POOLD=(EP.swim&&EP.swim.poolDepth)||300;
const SWDEF={
  crawl:{T:1.45,speed:150,depth:9,roll:0.62,hipFrac:0.6,elbow:1.3,w:0.2,kickAmp:0.18,kneeAmp:0.3,beats:3,kickBias:0.05,ankle:1,headLift:0,sink:0,breath:'right',breathTurn:1.3,breathLift:0,exhale:1,bob:1.5,surge:0.08,drag:0.82,spread:0},
  costas:{T:1.6,speed:130,depth:10,roll:0.6,hipFrac:0.6,elbow:1.4,w:0.25,kickAmp:0.22,kneeAmp:0.3,beats:3,kickBias:0.04,ankle:1,headLift:0,sink:0,breath:'none',breathTurn:0,breathLift:0,exhale:0,bob:1.5,surge:0.08,drag:0.82,spread:0},
  borboleta:{T:1.3,speed:140,depth:10,roll:0,hipFrac:0,elbow:1.2,w:0.35,kickAmp:0.3,kneeAmp:0.55,beats:1,kickBias:0.06,ankle:1,headLift:0,sink:0,breath:'front',breathTurn:0,breathLift:0.55,exhale:1,bob:5,surge:0.3,und:0.22,drag:0.82,spread:0},
  peito:{rate:2.4,speed:110,surge:0.55,surgePh:0,anchor:{bone:'Hips',y:-12},exhale:1,drag:0.82},
  flutuacao:{rate:1,speed:0,surge:0,anchor:{bone:'Head',y:4},exhale:0,drag:1}
};
const SWK=POOL?((EP.swim&&EP.swim.stroke)||'crawl'):null;
const SW=POOL?Object.assign({stroke:SWK},SWDEF[SWK]||SWDEF.crawl,EP.swim||{}):null;
const PROC=POOL&&['crawl','costas','borboleta'].includes(SWK);
const WL=0;
// --- água: tinta/absorção + cáusticas injetadas em todos os materiais ---
const UWU={uWL:{value:WL},uOff:{value:0},uTime:{value:0},uAtt:{value:2600},uWater:{value:new THREE.Color(0x0d5a78)},uTint:{value:new THREE.Color(0.62,0.86,0.98)},uCausI:{value:0.55}};
const CAUS_GLSL=`
float causF(vec2 p,float t){ p*=0.022; float v=0.;
  vec2 q=p+vec2(sin(p.y*1.7+t*0.9),cos(p.x*1.3-t*0.7))*0.9;
  v=sin(q.x*3.1+t*1.2)+sin(q.y*2.7-t*1.0)+sin((q.x+q.y)*2.2+t*0.8)+sin((q.x-q.y)*3.4-t*1.3);
  return pow(clamp(1.0-abs(v)*0.5,0.,1.),6.); }`;
function uw(mat){ if(!POOL) return mat; mat.onBeforeCompile=(sh)=>{ Object.assign(sh.uniforms,UWU);
  sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vWPos;')
    .replace('#include <project_vertex>',`#include <project_vertex>
    { vec4 wp=vec4(transformed,1.0);
      #ifdef USE_INSTANCING
      wp=instanceMatrix*wp;
      #endif
      vWPos=(modelMatrix*wp).xyz; }`);
  sh.fragmentShader=sh.fragmentShader.replace('#include <common>',`#include <common>
varying vec3 vWPos; uniform float uWL,uOff,uTime,uAtt,uCausI; uniform vec3 uWater,uTint;`+CAUS_GLSL)
    .replace('#include <fog_fragment>',`{
  float cu=step(cameraPosition.y,uWL), fu=step(vWPos.y,uWL); float d=length(vWPos-cameraPosition); float pu=0.;
  if(cu>0.5&&fu>0.5) pu=d; else if(cu>0.5) pu=d*(uWL-cameraPosition.y)/max(vWPos.y-cameraPosition.y,0.001);
  else if(fu>0.5) pu=d*(uWL-vWPos.y)/max(cameraPosition.y-vWPos.y,0.001);
  vec3 wn=normalize((vec4(normal,0.)*viewMatrix).xyz);
  float c=causF(vWPos.xz+vec2(0.,uOff),uTime)*fu*uCausI*(0.35+0.65*clamp(wn.y,0.,1.))*clamp(1.0+vWPos.y/600.,0.3,1.);
  gl_FragColor.rgb+=vec3(0.75,0.95,1.0)*c;
  gl_FragColor.rgb*=mix(vec3(1.),uTint,max(fu,cu*0.6));
  gl_FragColor.rgb=mix(gl_FragColor.rgb,uWater,1.0-exp(-pu/uAtt));
}
#include <fog_fragment>`); }; mat.customProgramCacheKey=()=>'uw1'; return mat; }

let water=null,waterU=null,poolG=null,ropes=null,BUB=null,DROP=null,ropeLen=0,tilePer=100;
if(POOL){
  floor.visible=false; grid.visible=false; disc.visible=false;
  Object.assign(key.shadow.camera,{left:-420,right:420,top:420,bottom:-420,near:10,far:2600}); key.shadow.camera.updateProjectionMatrix();
  key.position.set(160,700,260);
  poolG=new THREE.Group(); scene.add(poolG);
  // azulejos (canvas) — fundo
  const tc=document.createElement('canvas'); tc.width=tc.height=256; const g2=tc.getContext('2d');
  g2.fillStyle='#bfe6ee'; g2.fillRect(0,0,256,256); g2.fillStyle='#8fc4d2';
  for(let i=0;i<=8;i++){ g2.fillRect(i*32-1,0,2,256); g2.fillRect(0,i*32-1,256,2); }
  const tex=new THREE.CanvasTexture(tc); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(60,60); tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=8;
  // 256px = 8 azulejos de 12,5cm = 100cm
  const bottom=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000),uw(new THREE.MeshStandardMaterial({map:tex,roughness:.85,metalness:0})));
  bottom.rotation.x=-Math.PI/2; bottom.position.y=WL-POOLD; bottom.receiveShadow=true; poolG.add(bottom);
  const tex2=tex.clone(); tex2.repeat.set(0.3,60); tex2.needsUpdate=true;
  for(const lx of [0,-250,250]){ const ln=new THREE.Mesh(new THREE.PlaneGeometry(30,6000),uw(new THREE.MeshStandardMaterial({map:tex2,color:0x14223a,roughness:.8})));
    ln.rotation.x=-Math.PI/2; ln.position.set(lx,WL-POOLD+0.5,0); ln.receiveShadow=true; poolG.add(ln); }
  // parede lateral (azulejos) à esquerda e à direita, longe
  for(const sx of [-620,620]){ const wm=new THREE.Mesh(new THREE.PlaneGeometry(6000,POOLD+40),uw(new THREE.MeshStandardMaterial({map:tex.clone(),roughness:.85})));
    wm.material.map.repeat.set(60,(POOLD+40)/100); wm.material.map.needsUpdate=true; wm.rotation.y=sx<0?Math.PI/2:-Math.PI/2; wm.position.set(sx,WL-POOLD/2+20,0); wm.receiveShadow=true; poolG.add(wm); }
  // fundo d'água distante (cilindro por dentro) — some na névoa azul
  { const cy=new THREE.Mesh(new THREE.CylinderGeometry(2900,2900,POOLD,48,1,true),uw(new THREE.MeshStandardMaterial({color:0x000000,emissive:0x0b4a64,roughness:1,side:THREE.BackSide})));
